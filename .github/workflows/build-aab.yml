name: Build release AAB (unsigned for Play)

# Builds the release app bundle. It is signed here with a throwaway key only so
# the build passes; the real upload key is applied afterwards, outside CI.
on:
  workflow_dispatch:
  push:
    branches: [ccr-9dbc7059-sgyyq0]
    paths: ['.github/workflows/build-aab.yml', 'app/build.gradle.kts']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Throwaway signing key
        run: |
          keytool -genkeypair -keystore ci-temp.jks -storepass cipass123 -alias upload \
            -keypass cipass123 -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=CI"

      - name: Build release bundle (offline, no API key)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-temp.jks
          STORE_PASSWORD: cipass123
          KEY_PASSWORD: cipass123
        run: gradle :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Sistani-GPT-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Publish the bundle on a side branch so it can be fetched with git and re-signed.
      - name: Push bundle to side branch
        run: |
          mkdir out && cp app/build/outputs/bundle/release/*.aab out/app-release-unsigned.aab
          cd out && git init -q && git checkout -q -b aab
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add . 
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Release AAB ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" aab:ccr-9dbc7059-sgyyq0-aab
