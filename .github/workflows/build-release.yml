name: Build Play Store bundle

# Builds the signed .aab (for Play Console) and a signed .apk (for testing on a phone).
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   GEMINI_API_KEY     - Gemini API key
#   KEYSTORE_BASE64    - the upload keystore, base64 encoded (key alias: upload)
#   KEYSTORE_PASSWORD  - password of that keystore

on:
  push:
    branches: [ccr-957be456-4ah0hu, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -n "$GEMINI_API_KEY" ] || missing="$missing GEMINI_API_KEY"
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Write key and keystore
        run: |
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Build
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tauzih-ai-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
