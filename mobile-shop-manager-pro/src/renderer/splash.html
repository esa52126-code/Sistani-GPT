<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
<title>Mobile Shop Manager Pro</title>
<style>
  html,body{height:100%;margin:0}
  body{background:linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#1e3a8a 100%);color:#fff;font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;-webkit-app-region:drag;user-select:none}
  img{width:84px;height:84px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
  h1{font-size:22px;font-weight:650;margin:6px 0 0;letter-spacing:.2px}
  p{margin:0;color:#94a3b8;font-size:13px}
  .bar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px}
  .bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#22c55e);animation:m 1.1s ease-in-out infinite}
  @keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  small{position:absolute;bottom:14px;color:#64748b;font-size:11px}
</style></head>
<body><img src="assets/logo.svg" alt=""><h1>Mobile Shop Manager Pro</h1><p>Inventory · Sales · Credit · Reports</p><div class="bar"><i></i></div><small>Loading your shop…</small></body></html>
